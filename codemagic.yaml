workflows:
  expo-android-workflow:
    name: Expo Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Clean & Prebuild Android
        script: |
          rm -rf android
          npx expo prebuild --platform android
      - name: Build Android APK
        script: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -x lint -x test
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
