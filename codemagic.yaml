workflows:
  expo-android-workflow:
    name: Expo Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - expo
      node: 18
      java: 17
    scripts:
      - name: Install EAS CLI and Dependencies
        script: |
          npm install -g eas-cli
          npm install
      - name: Link EAS Project
        script: |
          eas project:init --non-interactive --force || true
      - name: Generate Local Keystore
        script: |
          keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK via EAS Local
        script: |
          EAS_NO_VCS=1 eas build --platform android --profile preview --local --non-interactive
    artifacts:
      - "*.apk"
      - build/*.apk
      - "**/*.apk"
