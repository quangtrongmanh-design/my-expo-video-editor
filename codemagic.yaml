workflows:
  expo-android-workflow:
    name: Expo Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18
      java: 17
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m'"
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Prebuild Android
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test --continue
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.apk
      - "*.apk"
