workflows:
  expo-android-workflow:
    name: Build Android APK Direct
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 18.18.0
      java: 17
      vars:
        NODE_ENV: production
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Run Expo Prebuild Clean
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android APK via Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
