workflows:
  expo-android-workflow:
    name: Expo Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - expo
      node: 18
      java: 17
    scripts:
      - name: Install EAS CLI and Dependencies
        script: |
          npm install -g eas-cli
          npm install
      - name: Link EAS Project
        script: |
          eas project:init --non-interactive --force || true
      - name: Build APK via EAS Cloud
        script: |
          eas build --platform android --profile preview --non-interactive
    artifacts:
      - "*.apk"
      - build/*.apk
      - "**/*.apk"
