workflows:
  expo-android-workflow:
    name: Build Android APK Direct
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 18.18.0
      java: 17
    scripts:
      - name: Install Dependencies
        script: |
          npm install
          npm install -g eas-cli
      - name: Prebuild Android Native Files
        script: |
          npx expo prebuild --platform android --clean
      - name: Fix Gradle Permissions & Accept Licenses
        script: |
          cd android
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x gradlew
      - name: Build Android APK via Gradle
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon -x test
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
