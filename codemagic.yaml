workflows:
  expo-android-workflow:
    name: Expo Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install EAS CLI and Dependencies
        script: |
          npm install -g eas-cli
          npm install
      - name: Build APK via EAS
        script: |
          eas build --platform android --profile preview --local --non-interactive
    artifacts:
      - "*.apk"
      - android/app/build/outputs/apk/**/*.apk
